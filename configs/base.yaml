# ============================================================================
# Andria Systems — Canonical Configuration
# ============================================================================

paths:
  raw_edgar: "dataset/raw/edgar"
  raw_fred: "dataset/raw/fred"
  raw_ofr: "dataset/raw/ofr"
  processed: "dataset/processed"
  artifacts: "artifacts"

ingest:
  memory_limit_gb: 6
  parquet_compression: "zstd"
  row_group_size: 100000
  partition_edgar: true          # write dataset/processed/edgar/quarter=*/
  min_valid_date: "2004-01-01"

features:
  manager_dna:
    min_quarters_active: 4       # require ≥1yr history
    top_n_concentration: 5       # top-5 position weight for concentration feature
    options_value_col: "Put"     # PUTCALL value identifying option rows

clustering:
  algorithm: "hdbscan"
  min_cluster_size_sweep: [50, 100, 150, 200, 300]
  min_samples_ratio: 0.25        # min_samples = int(min_cluster_size * ratio)
  cluster_selection_epsilon: 0.0
  random_state: 42
  umap:
    n_components: 2
    n_neighbors: 30
    min_dist: 0.1
    metric: "euclidean"
    random_state: 42

# Regime prototype vectors for stable semantic mapping (cosine similarity)
# Features order: [vix_level, yield_spread_10y2y, credit_spread_hy, fed_funds_delta, ofr_stress_index]
# All in standardised (z-score) space
hmm:
  n_components: 4
  covariance_type: "full"
  n_iter: 1000
  random_state: 42
  features:
    - "vix_level"
    - "yield_spread_10y2y"
    - "credit_spread_hy"
    - "fed_funds_delta"
    - "ofr_stress_index"
  regime_prototypes:
    Goldilocks:      [-1.2,  0.5, -0.8, -0.3, -1.0]
    Recovery:        [-0.3,  0.2, -0.1,  0.5, -0.3]
    Rate_Shock:      [ 0.5, -1.5,  0.3,  1.8,  0.5]
    Recession_Fear:  [ 2.0, -0.5,  2.0, -1.0,  2.0]

signals:
  racs:
    lambda_decay: 0.05
    min_activist_buyers: 2
    conviction_quantile_threshold: 0.75
    regime_weight: 0.3           # blend racs_raw * (1 + regime_weight * regime_confidence)

dashboard:
  port: 8050
  debug: false
  cache_timeout_seconds: 300
  max_rows_table: 500
  theme: "CYBORG"

backtest:
  filing_lag_days: 45
  holding_period_days: 90
  costs:
    large_cap_bps: 0.0020  # 20 bps
    small_cap_bps: 0.0050  # 50 bps
    small_cap_threshold_usd: 2000000000  # $2B market cap proxy via ADTV
    market_impact_gamma: 0.1
  significance:
    fdr_alpha: 0.05        # False Discovery Rate

# Phase 4: Real Market Data
market_data:
  cache_dir: "dataset/processed/market"
  cusip_map_path: "dataset/processed/cusip_ticker_map.parquet"
  max_tickers_per_batch: 100          # yfinance rate-limit buffer
  request_delay_seconds: 0.5          # polite delay between batches
  start_date: "2000-01-01"
  adj_close_only: true                # always use split+div adjusted close
  stale_threshold_days: 5             # data older than N trading days → stale flag

# Phase 4: Execution Realism
# (extends backtest.costs — appended separately to avoid yaml merge conflicts)
execution:
  fill_delay_days: 1                  # T+1 open entry (most impactful realism fix)
  adv_participation_limit: 0.05       # max 5% of ADTV per position
  execution_mode: "market"            # "market" | "vwap"
  vwap_slippage_discount: 0.5         # fraction of market slippage saved via VWAP

# Phase 4: Research Governance
experiment:
  seed: 42
  mlflow_tracking_uri: "artifacts/mlflow"
  mlflow_experiment_name: "andria_phase4"