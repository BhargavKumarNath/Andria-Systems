# Data Pipeline Configurations
data:
  min_valid_date: "2010-01-01"
  top_n_tickers: 10000
  exposure_imputation_value: "SH"
  paths:
    edgar: "dataset/raw/edgar_*.parquet"
    fred: "dataset/raw/fred_*.parquet"
    ofr: "dataset/raw/ofr_*.parquet"

# Manager DNA Features Spec
features:
manager_dna:
  # HHI (Herfindahl-Hirschman Index): Sum of squared portfolio weights.
  # Rationale: High HHI indicates Conviction Activists; low HHI indicates Index Huggers.
  hhi_threshold_high: 0.15

  # Put-Call Ratio: Options value / Total AUM.
  # Rationale: Identifies Macro Tourists and Hedgers.
    
  # Turnover: Absolute QoQ weight changes.
  # Rationale: High turnover = Quants/Traders. Low = Strategic Allocators.
    
  # Portfolio Size (AUM): Log of total value.
  # Rationale: Differentiates whales from nimble specialized funds.

clustering:
  algorithm: "hdbscan"
  min_cluster_size: 50
  min_samples: 10
  cluster_selection_epsilon: 0.5
  random_state: 42


