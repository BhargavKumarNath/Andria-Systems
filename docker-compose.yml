services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8050:8050"
    environment:
      - HF_TOKEN=${HF_TOKEN:-local_dev_token}
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
    command: uvicorn andria.api.main:app --host 0.0.0.0 --port 8050 --workers 1
