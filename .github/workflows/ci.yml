name: Andria Systems Institutional CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Security Scan (Bandit)
      run: |
        bandit -r andria/ -ll -s B608

    - name: Dependency Vulnerability Audit (pip-audit)
      run: |
        pip-audit --ignore PYSEC-2024-271 --ignore PYSEC-2024-277 --ignore PYSEC-2026-89 --ignore PYSEC-2026-161

    - name: Lint with Ruff
      run: |
        ruff check andria/ tests/

    - name: Static Type Checking (MyPy)
      run: |
        mypy andria/

    - name: Run Tests & Coverage
      run: |
        pytest tests/ -v --cov=andria --cov-report=xml

  deploy-to-hf-spaces:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Push to Hugging Face Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Capture the source commit SHA before we manipulate history
        SOURCE_SHA=$(git rev-parse --short HEAD)
        echo "GIT_SHA=$SOURCE_SHA" >> $GITHUB_ENV

        # Remove files that must not reach the HF Space
        git rm -r --cached artifacts/ reports/ data/ || true
        # Ensure .env secrets are never pushed
        git rm --cached .env 2>/dev/null || true

        # Embed the source SHA so governance.py can read it on the Space
        echo "GIT_SHA=$SOURCE_SHA" > .git_sha

        # Create a completely fresh git history (orphan branch) to drop binary commits
        git checkout --orphan hf-deploy
        git add .
        # Strip compiled Python bytecode before committing
        git rm -r --cached --ignore-unmatch "**/__pycache__" "*.pyc" "*.pyo" "*.pyd" 2>/dev/null || true
        git commit -m "Deploy from $SOURCE_SHA"
        git push --force https://user:$HF_TOKEN@huggingface.co/spaces/Bhargav12321/andria-backend hf-deploy:main

  deploy-frontend:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Vercel CLI
      run: npm install -g vercel@latest

    - name: Pull Vercel environment
      working-directory: ./frontend
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: Build project
      working-directory: ./frontend
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: Deploy to Vercel
      working-directory: ./frontend
      run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
