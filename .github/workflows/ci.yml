name: Andria Systems Institutional CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Security Scan (Bandit)
      run: |
        bandit -r andria/ -ll -s B608

    - name: Dependency Vulnerability Audit (pip-audit)
      run: |
        pip-audit --ignore PYSEC-2024-271 --ignore PYSEC-2024-277 --ignore PYSEC-2026-89

    - name: Lint with Ruff
      run: |
        ruff check andria/ tests/

    - name: Static Type Checking (MyPy)
      run: |
        mypy andria/

    - name: Run Tests & Coverage
      run: |
        pytest tests/ -v --cov=andria --cov-report=xml

  deploy-to-hf-spaces:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Push to Hugging Face Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # We need to wipe the binaries from the git index to ensure they aren't pushed
        git rm -r --cached artifacts/ reports/ || true
        
        # Create a completely fresh git history (orphan branch) to drop the old binary commits
        git checkout --orphan hf-deploy
        git add .
        git commit -m "Deploying to Hugging Face Spaces"
        git push --force https://user:$HF_TOKEN@huggingface.co/spaces/Bhargav12321/andria-backend hf-deploy:main
