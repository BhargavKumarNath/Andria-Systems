[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "andria-systems"
version = "0.1.0"
description = "Andria Systems — Institutional Investor Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Data layer
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    # Phase 4: Real market data
    "yfinance>=0.2.40",
    "exchange-calendars>=4.5.0",
    "pandas-datareader>=0.10.0",
    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    # Logging & CLI
    "structlog>=24.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    # ML & Stats
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "umap-learn>=0.5.6",
    "hmmlearn>=0.3.2",
    "statsmodels>=0.14.2",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    # Phase 4: Experiment tracking
    "mlflow>=2.13.0",
    # Viz & Dashboard
    "plotly>=5.22.0",
    "dash>=2.17.0",
    "dash-bootstrap-components>=1.6.0",
    "pandas>=2.2.0",
    # Phase 5: API, Orchestration, Telemetry
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "prefect>=2.19.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "psutil>=5.9.0",
    "pre-commit>=3.7.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.2",
]

[project.scripts]
andria = "andria.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["andria"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN204", "ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"andria/dashboard/*" = ["ANN201"]

[tool.ruff.lint.isort]
known-first-party = ["andria"]

# ── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
log_cli = true
log_cli_level = "INFO"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests requiring real data",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["andria"]
omit = ["tests/*", "notebooks/*"]
